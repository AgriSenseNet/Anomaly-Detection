name: Build and Push Airflow Pipeline Image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - requirements.txt
      - dags/**
      - batch_dags/**
      - batch_jobs/**
      - app/**
      - scripts/**
      - models/**
      - .env.local

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout yasindu-google-earth
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/agrisensenet/airflow-pipeline:latest
            ghcr.io/agrisensenet/airflow-pipeline:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print image tags
        run: |
          echo "Pushed: ghcr.io/agrisensenet/airflow-pipeline:latest"
          echo "Pushed: ghcr.io/agrisensenet/airflow-pipeline:sha-${{ github.sha }}"
          echo "ArgoCD uses 'latest' with pullPolicy:Always — no manifest update needed."
