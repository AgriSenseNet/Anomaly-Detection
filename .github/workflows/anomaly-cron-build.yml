name: Build & Push Anomaly Cron Image

on:
  push:
    branches: [main]
    paths:
      - infer_anomaly.py
      - Dockerfile.cron
      - app/**
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.cron
          push: true
          tags: ghcr.io/agrisensenet/anomaly-inference-cron:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
