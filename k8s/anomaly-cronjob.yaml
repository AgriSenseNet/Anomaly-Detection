apiVersion: v1
kind: Secret
metadata:
  name: anomaly-inference-secrets
  namespace: default
type: Opaque
stringData:
  postgres-password: "test"
  mlflow-tracking-uri: "https://mlflow.cropwise.garden"

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: anomaly-inference
  namespace: default
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: ghcr-pull-secret
          containers:
            - name: anomaly-inference
              image: ghcr.io/agrisensenet/anomaly-inference-cron:latest
              imagePullPolicy: Always
              env:
                - name: POSTGRES_HOST
                  value: postgres-postgresql.postgres.svc.cluster.local
                - name: POSTGRES_PORT
                  value: "5432"
                - name: POSTGRES_DB
                  value: smart_agri_c2
                - name: POSTGRES_USER
                  value: postgres
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: anomaly-inference-secrets
                      key: postgres-password
                - name: MLFLOW_TRACKING_URI
                  valueFrom:
                    secretKeyRef:
                      name: anomaly-inference-secrets
                      key: mlflow-tracking-uri
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  cpu: 1000m
                  memory: 1Gi
